# Alembic configuration for HealthGPT AI.
# The database URL is read from the application settings via env.py.

[alembic]
script_location = alembic
prepend_sys_path = .
# FileTemplate for the migration files
file_template = %%(rev)s_%%(slug)s

# timezone for the timestamps in the revision files
timezone = UTC

# Logging configuration
[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console
qualname =

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S